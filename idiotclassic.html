<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS">
  <title>You are an idiot</title>
</head>
<body bgcolor="black" text="white" onmousedown="spawnWindow()">
  <center>
    <img src="idiot.gif" width="480" height="360" onmousedown="return false;"><br>
  </center>

  <!-- サウンド再生 (IE専用) -->
  <bgsound src="idiot.mp3" loop="infinite">

  <script type="text/javascript">
    function spawnWindow() {
      window.open("lolclassic.html", "", "width=480,height=360");
    }

    // Eキーで閉じる
    document.onkeydown = function(e) {
      e = e || window.event;
      var key = e.keyCode || e.which;
      if (key == 69) window.close();
    };
  </script>
</body>
</html>
