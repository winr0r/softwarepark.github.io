<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>LOL</title>
    <style>
        body {
            margin: 0;
            background: black url("idiot.gif") center center no-repeat;
            background-size: contain;
            height: 100vh;
            width: 100vw;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <audio id="bgm" loop autoplay muted>
        <source src="idiot.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Eキーでウィンドウを閉じる
        document.addEventListener("keydown", function (event) {
            if (event.key.toLowerCase() === "e") {
                try {
                    window.close();
                } catch (e) {
                    console.log("ウィンドウを閉じられません:", e);
                }
            }
        });

        // 音楽再生
        const audio = document.getElementById("bgm");
        audio.muted = false;
        audio.play().catch(e => console.log("音楽再生エラー:", e));

        // ウィンドウ移動ロジック
        let x = window.screenX;
        let y = window.screenY;
        let vx = (Math.random() * 2) + 1;
        let vy = (Math.random() * 2) + 1;
        const w = window.outerWidth;
        const h = window.outerHeight;

        let boosted = false;
        let boostTimer = 0;

        function moveWindow() {
            try {
                x += vx;
                y += vy;

                if (x <= 0 || x + w >= screen.availWidth) vx *= -1;
                if (y <= 0 || y + h >= screen.availHeight) vy *= -1;

                if (!boosted && Math.random() < 0.01) {
                    boosted = true;
                    boostTimer = Math.floor(Math.random() * 30) + 10;
                    vx = (Math.random() * 20 - 10) || 8;
                    vy = (Math.random() * 20 - 10) || 8;
                }

                if (boosted) {
                    boostTimer--;
                    if (boostTimer <= 0) {
                        boosted = false;
                        vx = (Math.random() * 4 - 2) || 2;
                        vy = (Math.random() * 4 - 2) || 2;
                    }
                }

                window.moveTo(x, y);
                window.focus();
            } catch (e) {}

            requestAnimationFrame(moveWindow);
        }

        moveWindow();

        // クリックで増殖
        document.body.addEventListener("click", () => {
            for (let i = 0; i < 3; i++) {
                const offsetX = Math.floor(Math.random() * 200);
                const offsetY = Math.floor(Math.random() * 200);
                window.open("lol.html", "_blank", `width=400,height=300,left=${offsetX},top=${offsetY}`);
            }
        });
    </script>
</body>
</html>
