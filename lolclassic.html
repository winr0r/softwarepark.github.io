<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS">
  <title>LOL</title>
</head>
<body bgcolor="black" onmousedown="spawnWindow()">
  <center>
    <img src="idiot.gif" width="480" height="360" onmousedown="return false;"><br>
  </center>

  <!--音楽を鳴らす -->
  <bgsound src="idiot.mp3" loop="infinite">

  <script type="text/javascript">
    var x = window.screenLeft;
    var y = window.screenTop;
    var vx = 5;
    var vy = 3;
    var w = 480;
    var h = 360;
    var boosted = false;
    var boostTimer = 0;

    function moveWindow() {
      try {
        x += vx;
        y += vy;

        if (x <= 0 || x + w >= screen.availWidth) vx = -vx;
        if (y <= 0 || y + h >= screen.availHeight) vy = -vy;

        if (!boosted && Math.random() < 0.02) {
          boosted = true;
          boostTimer = 10 + Math.floor(Math.random() * 20);
          vx = (Math.random() * 20 - 10) || 8;
          vy = (Math.random() * 20 - 10) || 8;
        }

        if (boosted) {
          boostTimer--;
          if (boostTimer <= 0) {
            boosted = false;
            vx = (Math.random() * 6 - 3) || 3;
            vy = (Math.random() * 6 - 3) || 3;
          }
        }

        window.moveTo(x, y);
        window.focus();
      } catch(e) {}
    }

    setInterval(moveWindow, 50);

    function spawnWindow() {
      window.open("lolclassic.html", "", "width=480,height=360");
    }

    document.onkeydown = function(e) {
      e = e || window.event;
      var key = e.keyCode || e.which;
      if (key == 69) window.close();
    };
  </script>
</body>
</html>
